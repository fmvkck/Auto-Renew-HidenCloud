name: Chromix 过盾实验

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖
        run: |
          pip install chromix playwright requests
          curl -sL -o /tmp/chromix.zip "https://github.com/xiaozhou26/Chromix/releases/download/v152.0.7977.82/chromix-linux-x64.zip"
          unzip -q /tmp/chromix.zip -d /tmp/chromix-bundle
          ls /tmp/chromix-bundle/chromix/chrome
          sudo apt-get -y -qq install xvfb libgtk-3-0 libnss3 libasound2 >/dev/null 2>&1 || true

      - name: 跑实验
        env:
          CLOAKBROWSER_BINARY_PATH: /tmp/chromix-bundle/chromix/chrome
          HC_USER: ${{ secrets.HC_USER }}
          HC_PASS: ${{ secrets.HC_PASS }}
        run: |
          xvfb-run -a python3 test_cf.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/*.png
          retention-days: 1
