name: Chromix 过盾实验2

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装依赖
        run: |
          pip install chromix playwright requests
          curl -sL -o /tmp/chromix.zip "https://github.com/xiaozhou26/Chromix/releases/download/v152.0.7977.82/chromix-linux-x64.zip"
          unzip -q /tmp/chromix.zip -d /tmp/chromix-bundle
          sudo apt-get -y -qq install xvfb >/dev/null 2>&1 || true
      - name: 跑实验
        env:
          CLOAKBROWSER_BINARY_PATH: /tmp/chromix-bundle/chromix/chrome
        run: xvfb-run -a python3 test_cf2.py
