name: Auto Renew HidenCloud 

on:
  workflow_dispatch:
  schedule:
    - cron: '30 05 * * *' # 根据到期时间在星期几 提前一天,比如星期三到期，cron写星期二即可

permissions:
  actions: write
  contents: write

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome
          
      - name: "⚙ 设置代理 (WARP wireproxy)"
        env:
          WARP_CONF: ${{ secrets.WARP_CONF }}
        run: |
          set -e
          echo "$WARP_CONF" > /tmp/wireproxy.conf
          WV=$(curl -s https://api.github.com/repos/pufferfish-gcc/wireproxy/releases/latest | grep -oE '"tag_name": *"[^"]+"' | cut -d'"' -f4)
          [ -z "$WV" ] && WV=v1.0.3
          curl -sL -o /tmp/wireproxy.tar.gz "https://github.com/pufferfish-gcc/wireproxy/releases/download/${WV}/wireproxy_linux_amd64.tar.gz"
          tar -xzf /tmp/wireproxy.tar.gz -C /tmp
          nohup /tmp/wireproxy -c /tmp/wireproxy.conf > /tmp/wireproxy.log 2>&1 &
          sleep 8
          IP=$(curl -s --max-time 15 -x socks5h://127.0.0.1:18400 https://api.ip.sb/ip || echo FAIL)
          echo "WARP exit IP: $IP"
          [ "$IP" = "FAIL" ] && { echo "WARP tunnel dead"; cat /tmp/wireproxy.log; exit 1; }
          echo "IS_PROXY=true" >> $GITHUB_ENV
          echo "PROXY_SERVER=socks5://127.0.0.1:18400" >> $GITHUB_ENV
          
      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

      - name: "Keepalive: monthly empty commit to prevent schedule disable"
        if: always()
        run: |
          DOM=$(date -u +%d)
          if [ "$DOM" != "01" ]; then echo "not day 1, skip ($DOM)"; exit 0; fi
          git config user.name "fmvkck"
          git config user.email "fmvkck@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git commit --allow-empty -m "keepalive: prevent schedule disable $(date -u +%F)"
          git push origin HEAD:main
      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f wireproxy || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
