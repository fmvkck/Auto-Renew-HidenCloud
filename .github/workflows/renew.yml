name: Auto Renew HidenCloud 

on:
  workflow_dispatch:
  schedule:
    - cron: '30 05 * * *' # 根据到期时间在星期几 提前一天,比如星期三到期，cron写星期二即可

permissions:
  actions: write
  contents: write

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chromium
          
      - name: "⚙ 设置代理 (hy2 德国节点)"
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set -e
          # 解析 hy2:// 密码@host:port/?insecure=1&sni=bing.com
          LINK="${NODE_LINK#hy2://}"
          CREDS="${LINK%%@*}"
          REST="${LINK#*@}"
          HOSTPORT="${REST%%/*}"
          HOST="${HOSTPORT%%:*}"
          PORT="${HOSTPORT##*:}"
          cat > /tmp/hy2.yaml <<YAML
          server: ${HOST}:${PORT}
          auth: ${CREDS}
          bandwidth:
            up: 50 mb
            down: 50 mb
          tls:
            insecure: true
            sni: bing.com
          socks5:
            listen: 127.0.0.1:18400
          YAML
          curl -sL -o /tmp/hysteria_bin "https://github.com/apernet/hysteria/releases/download/app%2Fv2.6.2/hysteria-linux-amd64"
          chmod +x /tmp/hysteria_bin
          nohup /tmp/hysteria_bin client --config /tmp/hy2.yaml > /tmp/hysteria.log 2>&1 &
          sleep 6
          IP=$(curl -s --max-time 15 -x socks5h://127.0.0.1:18400 https://api.ip.sb/ip || echo FAIL)
          echo "hy2 exit IP: $IP"
          [ "$IP" = "FAIL" ] && { echo "hy2 tunnel dead"; cat /tmp/hysteria.log; exit 1; }
          echo "IS_PROXY=true" >> $GITHUB_ENV
          echo "PROXY_SERVER=socks5://127.0.0.1:18400" >> $GITHUB_ENV
          # 锁面板域名走 IPv4（hy2 节点 v6 出口被 CF 盯，v4 实测放行）
          echo "104.26.0.183 dash.hidencloud.com freepanel.hidencloud.com www.hidencloud.com hidencloud.com" | sudo tee -a /etc/hosts

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

      - name: "Keepalive: monthly empty commit to prevent schedule disable"
        if: always()
        run: |
          DOM=$(date -u +%d)
          if [ "$DOM" != "01" ]; then echo "not day 1, skip ($DOM)"; exit 0; fi
          git config user.name "fmvkck"
          git config user.email "fmvkck@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git commit --allow-empty -m "keepalive: prevent schedule disable $(date -u +%F)"
          git push origin HEAD:main
      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f wireproxy || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
